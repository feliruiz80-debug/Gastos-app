<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Control de gastos</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div>
          <p class="eyebrow">Personal</p>
          <h1>Control de gastos</h1>
        </div>
        <div class="month">
          <button id="prev-month" type="button" aria-label="Mes anterior">‹</button>
          <strong id="month-label"></strong>
          <button id="next-month" type="button" aria-label="Mes siguiente">›</button>
        </div>
      </header>

      <section class="totals" aria-label="Resumen del mes">
        <article>
          <span>Ingresos</span>
          <strong id="income-total">$ 0</strong>
        </article>
        <article>
          <span>Gastos</span>
          <strong id="expense-total">$ 0</strong>
        </article>
        <article>
          <span>Saldo del mes</span>
          <strong id="month-balance">$ 0</strong>
        </article>
      </section>
      <p id="available" class="available"></p>

      <section class="card">
        <div class="cap-head">
          <label for="cap">Tope de gastos del mes</label>
          <input id="cap" inputmode="decimal" placeholder="Sin tope" autocomplete="off" />
        </div>
        <div class="track" aria-hidden="true"><div id="cap-fill"></div></div>
        <p id="cap-note"></p>
      </section>

      <form id="form" class="card">
        <h2>Nuevo movimiento</h2>
        <div class="segment" role="radiogroup" aria-label="Tipo">
          <label><input type="radio" name="type" value="expense" checked /> Gasto</label>
          <label><input type="radio" name="type" value="income" /> Ingreso</label>
        </div>
        <label>
          Monto
          <input id="amount" inputmode="decimal" placeholder="0" autocomplete="off" required />
        </label>
        <label>
          Categoría
          <select id="category"></select>
        </label>
        <label>
          Fecha
          <input id="date" type="date" required />
        </label>
        <label>
          Nota
          <input id="note" maxlength="80" placeholder="Opcional" autocomplete="off" />
        </label>
        <p id="form-error" class="error" hidden></p>
        <button type="submit">Guardar</button>
      </form>

      <section class="card">
        <h2>Movimientos</h2>
        <p id="empty" class="muted">No hay movimientos en este mes.</p>
        <ul id="list"></ul>
      </section>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
